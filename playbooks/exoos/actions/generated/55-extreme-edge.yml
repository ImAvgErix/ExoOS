title: Extreme edge (Maximum FPS)
# Gated by extremeMode — only Maximum FPS setup path.
# Philosophy: as close to max quiet as possible without breaking a normal gaming desktop
# (Explorer, audio, network, GPU, basic shell). Store kept unless other options remove apps.
actions:
  - type: note
    id: extreme-note
    whenOption: extremeMode
    description: >-
      Extreme edge active. DISM+VBS+deep quiet run with this profile. Defender still
      follows your Defender setup choice (keep if anti-cheat needs it).

  # ── Latency / scheduler / GPU scheduling (safe registry) ──
  # MMCSS — verified against MS docs (not Twitter hype):
  # SystemResponsiveness: % reserved for low-priority. <10 or >100 clamp to 20.
  # So value 0 is cargo-cult and becomes DEFAULT 20. Min valid gaming = 10.
  # Scheduling Category High: Priority field is always treated as 2 (MS).
  # GPU Priority / SFIO Priority: documented as unused.
  # https://learn.microsoft.com/windows/win32/procthread/multimedia-class-scheduler-service
  - type: registry.set
    id: ext-mmcss-sysresp
    whenOption: extremeMode
    path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
    valueName: 'SystemResponsiveness'
    valueType: dword
    value: '10'
    ignoreErrors: true
    description: 'MS-verified: 10% bg reserve (0 clamps to 20)'
  - type: registry.set
    id: ext-mmcss-netthrot
    whenOption: extremeMode
    path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
    valueName: 'NetworkThrottlingIndex'
    valueType: dword
    value: '4294967295'
    ignoreErrors: true
  - type: registry.set
    id: ext-games-sched
    whenOption: extremeMode
    path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games'
    valueName: 'Scheduling Category'
    valueType: string
    value: 'High'
    ignoreErrors: true
    description: 'MS: High category is what moves thread priority band'

  # Game DVR / Game Bar / Captures off (background tax)
  - type: registry.set
    id: ext-gamedvr-app
    whenOption: extremeMode
    path: 'HKCU\System\GameConfigStore'
    valueName: 'GameDVR_Enabled'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: ext-gamedvr-pol
    whenOption: extremeMode
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
    valueName: 'AllowGameDVR'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: ext-gamebar
    whenOption: extremeMode
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR'
    valueName: 'AppCaptureEnabled'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: ext-gamebar2
    whenOption: extremeMode
    path: 'HKCU\SOFTWARE\Microsoft\GameBar'
    valueName: 'AutoGameModeEnabled'
    valueType: dword
    value: '1'
    ignoreErrors: true
  # FSO/FSE borderless preference is set globally in 56-gaming-polish (not exclusive)


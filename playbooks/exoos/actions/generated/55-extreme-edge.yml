  # BCD latency (canonical Extreme copies — not repeated in 05-exo-run / 56)
  - type: run
    id: ext-bcd-tick
    whenOption: extremeMode
    file: bcdedit.exe
    args: /set useplatformtick yes
    ignoreErrors: true
  - type: run
    id: ext-bcd-dyn
    whenOption: extremeMode
    file: bcdedit.exe
    args: /set disabledynamictick yes
    ignoreErrors: true

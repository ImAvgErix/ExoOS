title: Full OS depth stack (all layers)
# Single orchestrated pass across kernel, MMCSS, scheduler, input, GPU/DX,
# network, storage, NVIDIA, services, tasks, privacy — not just CPU/power.
# Shared path always; extremeMode adds Maximum FPS extras inside the script.
actions:
  - type: note
    id: fullstack-note
    description: >-
      Full OS depth: MMCSS Games High, network throttle off, Nagle off, HAGS,
      SwapEffect/VRR, input 1:1, storage NTFS, service quiet, telemetry tasks off,
      then platform power plan.

  - type: run
    id: fullstack-shared
    file: scripts/exo-core/Scripts/Apply-ExoFullStack.ps1
    args: -Shared -SkipPower
    runAs: admin
    ignoreErrors: true
    timeoutMs: 180000
    description: 'Full OS shared depth (all setup paths)'

  - type: run
    id: fullstack-extreme
    whenOption: extremeMode
    file: scripts/exo-core/Scripts/Apply-ExoFullStack.ps1
    args: -Extreme -SkipPower
    runAs: admin
    ignoreErrors: true
    timeoutMs: 180000
    description: 'Full OS extreme overlay (Maximum FPS)'

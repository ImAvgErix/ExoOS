  # ── Deep sweep script (unregister consumer reinstall tasks) ──
  - type: run
    id: tl-run-remove-bloat-tasks
    whenOption: serviceStrip
    file: scripts/exo-core/Scripts/RemoveBloatwareTasks.ps1
    runAs: admin
    ignoreErrors: true
    description: 'Unregister Outlook/Copilot/CDM/Edge reinstall tasks'

  - type: run
    id: tl-run-task-sweep
    whenOption: serviceStrip
    file: scripts/exo-core/Scripts/Exo-TaskLibrary-Sweep.ps1
    runAs: admin
    ignoreErrors: true
    timeoutMs: 180000
    description: 'Disable remaining CEIP/telemetry scheduled tasks by path pattern'

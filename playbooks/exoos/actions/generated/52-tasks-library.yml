title: Task Scheduler library deep strip
# Disable background maintenance / CEIP / telemetry / consumer bloat tasks.
# Gated by serviceStrip (same “quiet system” intent as services).
actions:
  - type: note
    id: tasks-lib-note
    whenOption: serviceStrip
    description: 'Deep Task Scheduler strip — telemetry, CEIP, feedback, maps, cloud, maintenance noise.'


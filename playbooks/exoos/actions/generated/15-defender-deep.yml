title: Defender deep strip
# Deep path: service stop + policy + CAB package add (SYSTEM) + helper scripts.
# Gated by defenderStrip option (default true for ExoOS gaming product).
actions:
  - type: note
    id: def-note
    whenOption: defenderStrip
    description: 'Deep Defender removal. Tamper Protection must be off. Reboot after. Some anti-cheat may complain.'

  - type: taskkill
    id: def-kill-sec
    whenOption: extremeMode
    processName: 'SecurityHealthSystray.exe'
    ignoreErrors: true

  - type: taskkill
    id: def-kill-msmpeng
    whenOption: defenderStrip
    processName: 'MsMpEng.exe'
    ignoreErrors: true

  - type: service.set
    id: def-svc-WinDefend
    whenOption: defenderStrip
    service: WinDefend
    start: disabled
    stop: true

  - type: service.set
    id: def-svc-WdNisSvc
    whenOption: defenderStrip
    service: WdNisSvc
    start: disabled
    stop: true

  - type: service.set
    id: def-svc-Sense
    whenOption: defenderStrip
    service: Sense
    start: disabled
    stop: true

  - type: service.set
    id: def-svc-WdFilter
    whenOption: defenderStrip
    service: WdFilter
    start: disabled
    stop: true

  - type: service.set
    id: def-svc-WdBoot
    whenOption: defenderStrip
    service: WdBoot
    start: disabled
    stop: true

  - type: service.set
    id: def-svc-SecurityHealth
    whenOption: defenderStrip
    service: SecurityHealthService
    start: disabled
    stop: true

  - type: service.set
    id: def-svc-wscsvc
    whenOption: defenderStrip
    service: wscsvc
    start: disabled
    stop: true

  - type: service.set
    id: def-svc-webthreat
    whenOption: defenderStrip
    service: webthreatdefsvc
    start: disabled
    stop: true
    ignoreErrors: true

  - type: service.set
    id: def-svc-webthreat-user
    whenOption: defenderStrip
    service: webthreatdefusersvc
    start: disabled
    stop: true
    ignoreErrors: true

  - type: service.set
    id: def-svc-mdcore
    whenOption: defenderStrip
    service: MDCoreSvc
    start: disabled
    stop: true
    ignoreErrors: true

  - type: service.set
    id: def-svc-sgrm
    whenOption: defenderStrip
    service: SgrmBroker
    start: disabled
    stop: true
    ignoreErrors: true

  - type: service.set
    id: def-svc-mssecflt
    whenOption: defenderStrip
    service: MsSecFlt
    start: disabled
    stop: true
    ignoreErrors: true

  - type: service.set
    id: def-svc-wdnisdrv
    whenOption: defenderStrip
    service: WdNisDrv
    start: disabled
    stop: true
    ignoreErrors: true

  - type: taskkill
    id: def-kill-nissrv
    whenOption: defenderStrip
    processName: 'NisSrv.exe'
    ignoreErrors: true

  - type: taskkill
    id: def-kill-smartscreen
    whenOption: extremeMode
    processName: 'smartscreen.exe'
    ignoreErrors: true

  - type: task.disable
    id: def-task-wd-cache
    whenOption: defenderStrip
    taskPath: '\Microsoft\Windows\Windows Defender\Windows Defender Cache Maintenance'
    ignoreErrors: true

  - type: task.disable
    id: def-task-wd-cleanup
    whenOption: defenderStrip
    taskPath: '\Microsoft\Windows\Windows Defender\Windows Defender Cleanup'
    ignoreErrors: true

  - type: task.disable
    id: def-task-wd-sched
    whenOption: defenderStrip
    taskPath: '\Microsoft\Windows\Windows Defender\Windows Defender Scheduled Scan'
    ignoreErrors: true

  - type: task.disable
    id: def-task-wd-verif
    whenOption: defenderStrip
    taskPath: '\Microsoft\Windows\Windows Defender\Windows Defender Verification'
    ignoreErrors: true

  - type: registry.set
    id: def-reg-DisableAntiSpyware
    whenOption: defenderStrip
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender'
    valueName: 'DisableAntiSpyware'
    valueType: dword
    value: '1'

  - type: registry.set
    id: def-reg-DisableAntiVirus
    whenOption: defenderStrip
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender'
    valueName: 'DisableAntiVirus'
    valueType: dword
    value: '1'

  - type: registry.set
    id: def-reg-DisableRealtime
    whenOption: defenderStrip
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    valueName: 'DisableRealtimeMonitoring'
    valueType: dword
    value: '1'

  - type: registry.set
    id: def-reg-DisableBehavior
    whenOption: defenderStrip
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    valueName: 'DisableBehaviorMonitoring'
    valueType: dword
    value: '1'

  - type: registry.set
    id: def-reg-DisableIOAV
    whenOption: defenderStrip
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    valueName: 'DisableIOAVProtection'
    valueType: dword
    value: '1'

  - type: registry.set
    id: def-reg-SmartScreen
    whenOption: defenderStrip
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System'
    valueName: 'EnableSmartScreen'
    valueType: dword
    value: '0'
    ignoreErrors: true

  - type: registry.set
    id: def-reg-Spynet
    whenOption: defenderStrip
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    valueName: 'SpynetReporting'
    valueType: dword
    value: '0'
    ignoreErrors: true

  - type: registry.set
    id: def-reg-SampleSubmit
    whenOption: defenderStrip
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    valueName: 'SubmitSamplesConsent'
    valueType: dword
    value: '2'
    ignoreErrors: true

  - type: registry.set
    id: def-reg-MAPS
    whenOption: defenderStrip
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    valueName: 'DisableBlockAtFirstSeen'
    valueType: dword
    value: '1'
    ignoreErrors: true

  - type: registry.set
    id: def-reg-DisableOnAccess
    whenOption: defenderStrip
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    valueName: 'DisableOnAccessProtection'
    valueType: dword
    value: '1'

  - type: registry.set
    id: def-reg-DisableScanOnRealtime
    whenOption: defenderStrip
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    valueName: 'DisableScanOnRealtimeEnable'
    valueType: dword
    value: '1'

  - type: registry.set
    id: def-reg-Tamper
    whenOption: defenderStrip
    path: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Features'
    valueName: 'TamperProtection'
    valueType: dword
    value: '0'
    ignoreErrors: true

  - type: appx.remove
    id: def-appx-sechealth
    whenOption: defenderStrip
    package: '*SecHealthUI*'
    ignoreErrors: true

  # Deep: CAB-based component removal (same path as deep gaming playbooks)
  - type: run
    id: def-cab-script
    whenOption: defenderStrip
    file: scripts/exo-core/Scripts/DisableDefender.ps1
    runAs: system
    ignoreErrors: true
    timeoutMs: 600000
    description: 'CAB package Defender removal as SYSTEM'

  - type: run
    id: def-helper
    whenOption: defenderStrip
    file: scripts/defender/Exo-Defender-Disable.ps1
    ignoreErrors: true
    description: 'Helper strip script'

title: Shared baseline (all setup paths)
# Safe for Balanced, Privacy, and Maximum FPS.
# Windows Update is paused (resumable) — never permanently hard-killed here.
actions:
  - type: note
    id: shared-note
    description: 'Shared baseline: pause Windows Update, input/visual snappiness, light privacy.'

  # ── Windows Update pause (all plans) ──
  - type: run
    id: shared-wu-pause
    file: scripts/exo-core/Scripts/Pause-WindowsUpdate.ps1
    runAs: admin
    ignoreErrors: true
    timeoutMs: 60000
    description: 'Pause quality + feature updates ~35 days (resume in Settings)'

  - type: service.set
    id: shared-dosvc-manual
    service: DoSvc
    start: manual
    stop: true
    ignoreErrors: true
    description: 'Delivery Optimization → manual (less P2P background)'

  # ── Input / snappy desktop (all plans) — duplicated safe set if polish runs after ──
  - type: registry.set
    id: shared-mouse-speed
    path: 'HKCU\Control Panel\Mouse'
    valueName: 'MouseSpeed'
    valueType: string
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-mouse-t1
    path: 'HKCU\Control Panel\Mouse'
    valueName: 'MouseThreshold1'
    valueType: string
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-mouse-t2
    path: 'HKCU\Control Panel\Mouse'
    valueName: 'MouseThreshold2'
    valueType: string
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-menu-delay
    path: 'HKCU\Control Panel\Desktop'
    valueName: 'MenuShowDelay'
    valueType: string
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-minanimate
    path: 'HKCU\Control Panel\Desktop\WindowMetrics'
    valueName: 'MinAnimate'
    valueType: string
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-visualfx
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects'
    valueName: 'VisualFXSetting'
    valueType: dword
    value: '2'
    ignoreErrors: true
  - type: registry.set
    id: shared-gamemode
    path: 'HKCU\Software\Microsoft\GameBar'
    valueName: 'AutoGameModeEnabled'
    valueType: dword
    value: '1'
    ignoreErrors: true

  # ── Full OS core (all plans) — was missing on live hosts after partial applies ──
  # MMCSS (MS docs): only Scheduling Category is meaningful for Games High band.
  # GPU Priority / SFIO unused; Priority forced to 2 under High. SR=10 not 0 (0 clamps to 20).
  - type: registry.set
    id: shared-mmcss-sched
    path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games'
    valueName: 'Scheduling Category'
    valueType: string
    value: 'High'
    ignoreErrors: true
    description: 'MS: High sets priority band; Priority field ignored under High'
  - type: registry.set
    id: shared-netthrot
    path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
    valueName: 'NetworkThrottlingIndex'
    valueType: dword
    value: '4294967295'
    ignoreErrors: true
    description: 'Disable multimedia network throttle (all plans)'
  - type: registry.set
    id: shared-sysresp
    path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
    valueName: 'SystemResponsiveness'
    valueType: dword
    value: '10'
    ignoreErrors: true
    description: 'MS: min valid 10%; 0 clamps to default 20'
  - type: registry.set
    whenOption: extremeMode
    id: shared-win32prio
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\PriorityControl'
    valueName: 'Win32PrioritySeparation'
    valueType: dword
    value: '36'
    ignoreErrors: true
    description: '0x24 short/variable foreground (extreme bumps to 0x26)'
  - type: registry.set
    id: shared-timer-res
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
    valueName: 'GlobalTimerResolutionRequests'
    valueType: dword
    value: '1'
    ignoreErrors: true
  - type: registry.set
    id: shared-powerthrottle
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling'
    valueName: 'PowerThrottlingOff'
    valueType: dword
    value: '1'
    ignoreErrors: true
  - type: registry.set
    id: shared-hags
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers'
    valueName: 'HwSchMode'
    valueType: dword
    value: '2'
    ignoreErrors: true
    description: 'HAGS on for all plans (GPU scheduling)'
  - type: registry.set
    id: shared-swap-effect
    path: 'HKCU\Software\Microsoft\DirectX\UserGpuPreferences'
    valueName: 'DirectXUserGlobalSettings'
    valueType: string
    value: 'VRROptimizeEnable=1;SwapEffectUpgradeEnable=1;'
    ignoreErrors: true
  - type: registry.set
    id: shared-gamedvr
    path: 'HKCU\System\GameConfigStore'
    valueName: 'GameDVR_Enabled'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-gamedvr-pol
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
    valueName: 'AllowGameDVR'
    valueType: dword
    value: '0'
    ignoreErrors: true

  # ── Light privacy (all plans — no service strip required) ──
  - type: registry.set
    id: shared-ad-id
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo'
    valueName: 'Enabled'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-ad-id-lm
    path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AdvertisingInfo'
    valueName: 'Enabled'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-activity-feed
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System'
    valueName: 'EnableActivityFeed'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-activity-pub
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System'
    valueName: 'PublishUserActivities'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-activity-up
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System'
    valueName: 'UploadUserActivities'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-tailored
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Privacy'
    valueName: 'TailoredExperiencesWithDiagnosticDataEnabled'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-telemetry
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    valueName: 'AllowTelemetry'
    valueType: dword
    value: '1'
    ignoreErrors: true
    description: '1 = basic (not 0 — keeps security channel healthier than full nuclear 0)'
  - type: registry.set
    id: shared-consumer
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    valueName: 'DisableWindowsConsumerFeatures'
    valueType: dword
    value: '1'
    ignoreErrors: true
  - type: registry.set
    id: shared-softlanding
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    valueName: 'DisableSoftLanding'
    valueType: dword
    value: '1'
    ignoreErrors: true
  - type: registry.set
    id: shared-clipboard-cloud
    path: 'HKCU\Software\Microsoft\Clipboard'
    valueName: 'CloudClipboardAutomaticUpload'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-do
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
    valueName: 'DODownloadMode'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-startup-delay
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Serialize'
    valueName: 'StartupDelayInMSec'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-widgets-tb
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
    valueName: 'TaskbarDa'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: shared-chat-tb
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
    valueName: 'TaskbarMn'
    valueType: dword
    value: '0'
    ignoreErrors: true

  # Quiet a few always-safe telemetry services (all plans)
  - type: service.set
    id: shared-svc-DiagTrack
    service: DiagTrack
    start: disabled
    stop: true
    ignoreErrors: true
  - type: service.set
    id: shared-svc-dmwappush
    service: dmwappushservice
    start: disabled
    stop: true
    ignoreErrors: true
  - type: service.set
    id: shared-svc-RetailDemo
    service: RetailDemo
    start: disabled
    stop: true
    ignoreErrors: true
  - type: service.set
    id: shared-svc-RemoteRegistry
    service: RemoteRegistry
    start: disabled
    stop: true
    ignoreErrors: true

  # Safe scheduled noise (all plans)
  - type: task.disable
    id: shared-task-ceip
    taskPath: '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator'
    ignoreErrors: true
  - type: task.disable
    id: shared-task-usbceip
    taskPath: '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip'
    ignoreErrors: true
  - type: task.disable
    id: shared-task-appraiser
    taskPath: '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser'
    ignoreErrors: true
  - type: task.disable
    id: shared-task-pdata
    taskPath: '\Microsoft\Windows\Application Experience\ProgramDataUpdater'
    ignoreErrors: true
  - type: task.disable
    id: shared-task-diskdiag
    taskPath: '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector'
    ignoreErrors: true
  - type: task.disable
    id: shared-task-siuf
    taskPath: '\Microsoft\Windows\Feedback\Siuf\DmClient'
    ignoreErrors: true
  - type: task.disable
    id: shared-task-siuf2
    taskPath: '\Microsoft\Windows\Feedback\Siuf\DmClientOnScenarioDownload'
    ignoreErrors: true
  - type: task.disable
    id: shared-task-maps
    taskPath: '\Microsoft\Windows\Maps\MapsUpdateTask'
    ignoreErrors: true
  - type: task.disable
    id: shared-task-wer
    taskPath: '\Microsoft\Windows\Windows Error Reporting\QueueReporting'
    ignoreErrors: true

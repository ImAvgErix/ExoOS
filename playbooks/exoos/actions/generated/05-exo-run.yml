# Unique apply-path runs. Do not re-run YAML already covered elsewhere:
#   taskkill (41-process-reduction / 55-extreme-edge)
#   BCD useplatformtick / disabledynamictick (55-extreme-edge)
#   hibernate off (80-power)
#   PauseUpdates / Windows11.bat / powerplan.bat / RemoveBloatwareTasks (58 / 52 / 80)
# Do not taskkill setup / StartMenuExperienceHost / ShellExperienceHost.
# Do not run filters.bat (clears storage/camera class filters).
title: Exo unique runs
actions:
  - type: run
    whenOption: extremeMode
    id: exo-bcd-bootmenu
    file: bcdedit.exe
    args: /set bootmenupolicy Legacy
    ignoreErrors: true
    description: 'Legacy boot menu (Extreme)'

  - type: run
    id: exo-fsutil-lastaccess
    file: fsutil.exe
    args: behavior set disablelastaccess 1
    ignoreErrors: true
    description: 'NTFS last-access off'

  - type: run
    id: exo-fsutil-8dot3
    file: fsutil.exe
    args: behavior set disable8dot3 1
    ignoreErrors: true
    description: 'NTFS 8.3 names off'

  - type: run
    id: exo-fsutil-trim
    file: fsutil.exe
    args: behavior set disabledeletenotify 0
    ignoreErrors: true
    description: 'TRIM / delete-notify on'

  - type: run
    id: exo-fsutil-pagefile
    file: fsutil.exe
    args: behavior set encryptpagingfile 0
    ignoreErrors: true
    description: 'Do not encrypt pagefile'

  - type: run
    id: exo-dism-reserved
    file: DISM.exe
    args: /Online /set-reservedstoragestate /state:disabled
    ignoreErrors: true
    description: 'Reserved Storage off'

  - type: run
    whenOption: extremeMode
    id: exo-reg-bat
    file: scripts/exo-core/Scripts/reg.bat
    ignoreErrors: true
    description: 'Folder/context-menu cleanup (Extreme)'

  - type: run
    id: exo-svchost-split
    file: scripts/exo-core/Scripts/SVCHostSplitDisable.ps1
    ignoreErrors: true
    description: 'Group svchost (fewer processes)'

  - type: run
    whenOption: extremeMode
    id: exo-disable-devices
    file: scripts/exo-core/Scripts/DisableDevices.ps1
    ignoreErrors: true
    description: 'Offline PnP device disable (no DevManView CDN)'

  - type: run
    whenOption: extremeMode
    id: exo-remove-components
    file: scripts/exo-core/Scripts/RemoveComponents.ps1
    ignoreErrors: true
    description: 'Local CAB component strip (no Nexus CDN)'

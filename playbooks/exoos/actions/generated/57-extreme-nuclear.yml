title: Extreme nuclear (Maximum FPS opt-in)
# All of this is gated by extremeMode only.
# Choosing Maximum FPS in setup = opting into this full edge pack.
# risk: nuclear requires AllowNuclear (engine enables it when extremeMode is true).
actions:
  - type: note
    id: nuclear-note
    whenOption: extremeMode
    risk: nuclear
    description: >-
      EXTREME (Maximum FPS): print spooler disabled, CPU mitigations stripped,
      extra quiet. Windows Update is paused (not permanently killed) so you can resume.
      Can break printers and some anti-cheat. Reboot after apply.

  # Windows Update: pause is applied for ALL profiles in 58-shared-baseline.
  # Extreme only quiets wake/scan tasks — does NOT disable wuauserv/BITS permanently.
  - type: task.disable
    id: nuc-task-uso-scan
    whenOption: extremeMode
    risk: nuclear
    taskPath: '\Microsoft\Windows\UpdateOrchestrator\Schedule Scan'
    ignoreErrors: true
  - type: task.disable
    id: nuc-task-uso-scan2
    whenOption: extremeMode
    risk: nuclear
    taskPath: '\Microsoft\Windows\UpdateOrchestrator\Schedule Scan Static Task'
    ignoreErrors: true
  - type: task.disable
    id: nuc-task-waas
    whenOption: extremeMode
    risk: nuclear
    taskPath: '\Microsoft\Windows\WaaSMedic\PerformRemediation'
    ignoreErrors: true
  - type: task.disable
    id: nuc-task-sih4
    whenOption: extremeMode
    risk: nuclear
    taskPath: '\Microsoft\Windows\InstallService\WakeUpAndContinueUpdates'
    ignoreErrors: true
  - type: task.disable
    id: nuc-task-sih5
    whenOption: extremeMode
    risk: nuclear
    taskPath: '\Microsoft\Windows\InstallService\WakeUpAndScanForUpdates'
    ignoreErrors: true
  - type: service.set
    id: nuc-WaaSMedic
    whenOption: extremeMode
    risk: nuclear
    service: WaaSMedicSvc
    start: disabled
    stop: true
    ignoreErrors: true
    description: 'Stops WU self-heal from undoing pauses immediately'

  # ═══════════════════════════════════════════
  # Print spooler — fully off
  # ═══════════════════════════════════════════
  - type: service.set
    id: nuc-spooler
    whenOption: extremeMode
    risk: nuclear
    service: Spooler
    start: disabled
    stop: true
    ignoreErrors: true
  - type: service.set
    id: nuc-printnotify
    whenOption: extremeMode
    risk: nuclear
    service: PrintNotify
    start: disabled
    stop: true
    ignoreErrors: true
  - type: service.set
    id: nuc-printworkflow
    whenOption: extremeMode
    risk: nuclear
    service: PrintWorkflowUserSvc
    start: disabled
    stop: true
    ignoreErrors: true

  # ═══════════════════════════════════════════
  # CPU mitigations strip (Spectre / Meltdown class)
  # Can help old CPUs; security tradeoff; some AC may care
  # ═══════════════════════════════════════════
  - type: registry.set
    id: nuc-mitigation-override
    whenOption: extremeMode
    risk: nuclear
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
    valueName: 'FeatureSettingsOverride'
    valueType: dword
    value: '3'
    ignoreErrors: true
  - type: registry.set
    id: nuc-mitigation-mask
    whenOption: extremeMode
    risk: nuclear
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
    valueName: 'FeatureSettingsOverrideMask'
    valueType: dword
    value: '3'
    ignoreErrors: true
  - type: registry.set
    id: nuc-mitigation-enabled
    whenOption: extremeMode
    risk: nuclear
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
    valueName: 'FeatureSettings'
    valueType: dword
    value: '1'
    ignoreErrors: true

  # Kernel / speculative store bypass related (best-effort)
  - type: run
    id: nuc-mitigation-script
    whenOption: extremeMode
    risk: nuclear
    file: powershell.exe
    args: >-
      -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
      "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name FeatureSettingsOverride -Value 3 -Type DWord -Force -EA 0;
       Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name FeatureSettingsOverrideMask -Value 3 -Type DWord -Force -EA 0;
       if (Get-Command Set-ProcessMitigation -EA 0) {
         # system-wide leave defaults; registry is the common gaming path
       }"
    ignoreErrors: true
    description: 'Reinforce mitigation override registry'

  # ═══════════════════════════════════════════
  # Extra kill switches
  # ═══════════════════════════════════════════
  - type: service.set
    id: nuc-WSearch
    whenOption: extremeMode

title: Network latency + bandwidth
# Declarative NIC/TCP pack — competes with Nexus/FSOS-X network depth.
actions:
  - type: note
    id: net-note
    description: 'Nagle off, NIC interrupt moderation/EEE/flow-control off, TCP heuristics off, RSC off, BBR2 when available.'

  - type: run
    id: nic-latency
    file: scripts/Tune-NicLatency.ps1
    args: '-Extreme'
    runAs: admin
    ignoreErrors: true
    timeoutMs: 120000
    description: 'Nagle + NIC advanced props + TCP global + RSC/BBR2'

  - type: registry.set
    id: net-default-ttl
    path: 'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    valueName: 'DefaultTTL'
    valueType: dword
    value: '64'
    ignoreErrors: true

  - type: registry.set
    id: net-tcp-max-connect
    path: 'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    valueName: 'TcpMaxConnectRetransmissions'
    valueType: dword
    value: '1'
    ignoreErrors: true

  - type: registry.set
    id: net-taskoffload-keep
    path: 'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    valueName: 'DisableTaskOffload'
    valueType: dword
    value: '0'
    ignoreErrors: true
    description: 'Keep NIC offloads on (throughput)'

  - type: registry.set
    id: net-timed-wait
    path: 'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    valueName: 'TcpTimedWaitDelay'
    valueType: dword
    value: '30'
    ignoreErrors: true

  - type: registry.set
    id: net-max-user-port
    path: 'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    valueName: 'MaxUserPort'
    valueType: dword
    value: '65534'
    ignoreErrors: true

  - type: registry.set
    id: net-tcp-max-data-retrans
    path: 'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    valueName: 'TcpMaxDataRetransmissions'
    valueType: dword
    value: '5'
    ignoreErrors: true

  - type: registry.set
    whenOption: extremeMode
    id: net-nonbesteffort
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Psched'
    valueName: 'NonBestEffortLimit'
    valueType: dword
    value: '0'
    ignoreErrors: true
    description: 'No reserved QoS bandwidth for background'

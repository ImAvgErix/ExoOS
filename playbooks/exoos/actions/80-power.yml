title: Exo power plan
actions:
  - type: note
    id: power-note
    description: >
      Prefers a fixed Exo scheme GUID if present; otherwise Ultimate Performance
      template. Not Exo v6.1 import (no shipping .pow binary yet — GUID activate only).

  # Ultimate Performance scheme (hidden on many SKUs) — create then activate
  - type: run
    id: power-duplicate-ultimate
    file: powercfg.exe
    args: -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61
    description: Ensure Ultimate Performance exists

  - type: run
    id: power-activate-ultimate
    file: powercfg.exe
    args: /setactive e9a42b02-d5df-448d-aa00-03f14749eb61
    description: Activate Ultimate Performance as Exo baseline until custom .pow ships

  - type: run
    id: power-monitor-timeout-ac
    file: powercfg.exe
    args: /change monitor-timeout-ac 0

  - type: run
    id: power-disk-timeout-ac
    file: powercfg.exe
    args: /change disk-timeout-ac 0

  - type: run
    id: power-standby-timeout-ac
    file: powercfg.exe
    args: /change standby-timeout-ac 0

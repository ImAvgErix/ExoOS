title: Feature defaults
# AI/Copilot, OneDrive, Edge, VBS, hosts — gated by setup options.
actions:
  # --- AI / Copilot / Recall (default on) ---
  - type: run
    id: feat-ai-script
    whenOption: removeAi
    file: scripts/exo-core/Scripts/DisableAI.ps1
    runAs: system
    ignoreErrors: true
    description: 'Remove AI components (CAB + policy)'
  - type: run
    id: feat-copilot-script
    whenOption: removeAi
    file: scripts/exo-core/Scripts/Copilot.ps1
    ignoreErrors: true
    description: 'Remove Copilot Win32'
  - type: appx.remove
    id: feat-appx-copilot
    whenOption: removeAi
    package: '*Microsoft.Copilot*'
    ignoreErrors: true
    description: 'Exo'
  - type: appx.remove
    id: feat-appx-aix
    whenOption: removeAi
    package: '*MicrosoftWindows.Client.AIX*'
    ignoreErrors: true
    description: 'Exo'
  - type: registry.set
    id: feat-reg-copilot-off
    whenOption: removeAi
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsCopilot'
    valueName: 'TurnOffWindowsCopilot'
    valueType: dword
    value: '1'
    description: 'Exo'
  - type: registry.set
    id: feat-reg-ai-data
    whenOption: removeAi
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
    valueName: 'DisableAIDataAnalysis'
    valueType: dword
    value: '1'
    description: 'Exo'
  - type: registry.set
    id: feat-reg-copilot-btn
    whenOption: removeAi
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
    valueName: 'ShowCopilotButton'
    valueType: dword
    value: '0'
    description: 'Exo'

  # --- OneDrive (default on) ---
  - type: run
    id: feat-onedrive
    whenOption: removeOneDrive
    file: scripts/exo-core/Scripts/OneDrive.cmd
    ignoreErrors: true
    description: 'Uninstall OneDrive'
  - type: appx.remove
    id: feat-appx-onedrive
    whenOption: removeOneDrive
    package: '*OneDrive*'
    ignoreErrors: true
    description: 'Exo'

  # --- Edge strip (Extreme / stripEdge). Not Balanced-safe-ceiling default. ---
  # Edge is forced Windows bloat; user browsers install via setup multi-select.
  - type: run
    id: feat-edge
    whenOption: stripEdge
    file: scripts/exo-core/Scripts/edge.ps1
    ignoreErrors: true
    description: 'Remove Edge + stubs (stripEdge: Extreme or cleanup opt-in)'

  # --- VBS (optional, off by default — can break HVCI/anti-cheat on some setups) ---
  - type: run
    id: feat-vbs
    whenOption: disableVbs
    file: scripts/exo-core/Scripts/DisableVBS.cmd
    runAs: system
    ignoreErrors: true
    risk: ac-sensitive
    description: 'Disable VBS'

  # --- Privacy hosts (default on) ---
  - type: run
    id: feat-hosts
    whenOption: privacyHosts
    file: scripts/exo-core/Scripts/Hosts.ps1
    ignoreErrors: true
    description: 'Privacy hosts file'

  # --- AMOLED (optional) ---
  - type: run
    id: feat-amoled
    whenOption: amoled
    file: scripts/exo-core/Windows11/AMOLEDMode.ps1
    ignoreErrors: true
    description: 'AMOLED pure black'

  # --- Transparency off (optional) ---

  # ── Catalog leftovers (features / Edge) ──
  - type: registry.set
    id: 'exo-reg-26'
    path: 'HKLM\SOFTWARE\Microsoft\EdgeUpdate'
    valueName: 'DoNotUpdateToEdgeWithChromium'
    valueType: dword
    value: '1'
    description: 'Exo'
  - type: registry.set
    id: 'exo-reg-40'
    path: 'HKLM\SOFTWARE\Policies\Microsoft\EdgeUpdate'
    valueName: 'InstallDefault'
    valueType: dword
    value: '0'
    description: 'Exo'
  - type: registry.set
    id: 'exo-reg-41'
    path: 'HKLM\SOFTWARE\Policies\Microsoft\EdgeUpdate'
    valueName: 'Install{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}'
    valueType: dword
    value: '0'
    description: 'Exo'
  - type: registry.set
    id: 'exo-reg-42'
    path: 'HKLM\SOFTWARE\Policies\Microsoft\EdgeUpdate'
    valueName: 'Install{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
    valueType: dword
    value: '1'
    description: 'Exo'
  - type: registry.set
    id: 'exo-reg-43'
    path: 'HKLM\SOFTWARE\Policies\Microsoft\EdgeUpdate'
    valueName: 'DoNotUpdateToEdgeWithChromium'
    valueType: dword
    value: '1'
    description: 'Exo'
  - type: registry.set
    whenOption: stripEdge
    id: 'exo-reg-624'
    path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.MicrosoftEdge.Stable_8wekyb3d8bbwe'
    valueName: ''
    valueType: none
    value: '0'
    description: 'Exo'
  - type: registry.set
    whenOption: stripEdge
    id: 'exo-reg-626'
    path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.MicrosoftEdge_8wekyb3d8bbwe'
    valueName: ''
    valueType: none
    value: '0'
    description: 'Exo'
  - type: registry.set
    whenOption: stripEdge
    id: 'exo-reg-628'
    path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.MicrosoftEdgeDevToolsClient_8wekyb3d8bbwe'
    valueName: ''
    valueType: none
    value: '0'
    description: 'Exo'

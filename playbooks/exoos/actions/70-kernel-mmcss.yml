title: Memory and MMCSS
actions:
  - type: registry.set
    id: disable-page-combining
    path: HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management
    valueName: DisablePageCombining
    valueType: dword
    value: "1"
    description: Exo kernel.yml — reduce page combining overhead

  - type: registry.set
    id: large-system-cache-off
    path: HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management
    valueName: LargeSystemCache
    valueType: dword
    value: "0"
    description: Prefer program cache over system cache (desktop/gaming)

  - type: registry.set
    id: second-level-tlb
    path: HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management
    valueName: SecondLevelDataCache
    valueType: dword
    value: "0"
    description: Let OS auto-detect L2

  - type: registry.set
    id: fsutil-disable-last-access
    path: HKLM\SYSTEM\CurrentControlSet\Control\FileSystem
    valueName: NtfsDisableLastAccessUpdate
    valueType: dword
    value: "1"

  - type: registry.set
    id: fsutil-disable-8dot3
    path: HKLM\SYSTEM\CurrentControlSet\Control\FileSystem
    valueName: NtfsDisable8dot3NameCreation
    valueType: dword
    value: "1"

  - type: run
    whenOption: extremeMode
    id: bcdedit-disabledynamictick
    file: bcdedit.exe
    args: /set disabledynamictick Yes
    description: Exo/Exo-class timer — test if unstable on your CPU

  - type: run
    whenOption: extremeMode
    id: bcdedit-useplatformtick
    file: bcdedit.exe
    args: /set useplatformtick Yes
    description: Prefer platform tick (22H2 Exo default; 23H2 used No — ExoOS picks Yes for consistency)

  - type: run
    id: powercfg-hibernate-off
    file: powercfg.exe
    args: /h off
    description: Free disk + kill hybrid sleep path

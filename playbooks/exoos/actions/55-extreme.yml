    ignoreErrors: true
    description: 'Prefer TSC over HPET (pair with useplatformtick)'

  # Power: no CPU parking / min processor state 100% on AC
  - type: run
    id: polish-power-park
    whenOption: extremeMode
    file: powershell.exe
    args: >-
      -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
      "$s=(powercfg /getactivescheme) -replace '.*([0-9a-fA-F-]{36}).*','$1';
      powercfg /setacvalueindex $s SUB_PROCESSOR CPMINCORES 100;
      powercfg /setacvalueindex $s SUB_PROCESSOR CPMAXCORES 100;
      powercfg /setacvalueindex $s SUB_PROCESSOR PROCTHROTTLEMIN 100;
      powercfg /setacvalueindex $s SUB_PROCESSOR PROCTHROTTLEMAX 100;
      powercfg /setacvalueindex $s SUB_PROCESSOR PERFAUTONOMOUS 0;
      powercfg /setacvalueindex $s SUB_PROCESSOR PERFDUTYCYCLING 0;
      powercfg /setacvalueindex $s SUB_PCIEXPRESS ASPM 0;
      powercfg /setacvalueindex $s 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 0;
      powercfg /setactive $s"
    ignoreErrors: true
    description: 'Unpark cores, max CPU on AC, disable PCIe ASPM + USB selective suspend'


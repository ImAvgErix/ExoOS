    ignoreErrors: true
  - type: task.disable
    id: nuc-task-sih5
    whenOption: extremeMode
    risk: nuclear
    taskPath: '\Microsoft\Windows\InstallService\WakeUpAndScanForUpdates'
    ignoreErrors: true

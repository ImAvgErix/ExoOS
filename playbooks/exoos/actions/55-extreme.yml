title: Extreme / competitive edge
# Maximum FPS overlay: BCD, nuclear quiet, input/display/audio/USB.
actions:
  - type: note
    id: edge-note
    description: 'Competitive edge: input latency, monitor/GPU, audio/mic, USB/HID, kernel timers, startup permanence.'

  # ═══════════════════════════════════════════
  # Input — mouse / keyboard latency (all plans)
  # ═══════════════════════════════════════════
  - type: registry.set
    id: edge-raw-throttle-off
    path: 'HKCU\Control Panel\Mouse'
    valueName: 'RawMouseThrottleEnabled'
    valueType: dword
    value: '0'
    ignoreErrors: true
    description: 'Override bad baseline merge — never throttle raw mouse'
  - type: registry.set
    id: edge-raw-throttle-forced-off
    path: 'HKCU\Control Panel\Mouse'
    valueName: 'RawMouseThrottleForced'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: edge-raw-throttle-dur
    path: 'HKCU\Control Panel\Mouse'
    valueName: 'RawMouseThrottleDuration'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: edge-kb-delay
    path: 'HKCU\Control Panel\Keyboard'
    valueName: 'KeyboardDelay'
    valueType: string
    value: '0'
    ignoreErrors: true
    description: 'Shortest keyboard repeat delay'
  - type: registry.set
    id: edge-kb-speed
    path: 'HKCU\Control Panel\Keyboard'
    valueName: 'KeyboardSpeed'
    valueType: string
    value: '31'
    ignoreErrors: true
    description: 'Fastest keyboard repeat'
  - type: registry.set
    whenOption: extremeMode
    id: edge-mouse-queue
    path: 'HKLM\SYSTEM\CurrentControlSet\Services\mouclass\Parameters'
    valueName: 'MouseDataQueueSize'
    valueType: dword
    value: '256'
    ignoreErrors: true
    description: 'Larger queue for high-Hz mice (avoids packet loss)'
  - type: registry.set
    whenOption: extremeMode
    id: edge-kbd-queue
    path: 'HKLM\SYSTEM\CurrentControlSet\Services\kbdclass\Parameters'
    valueName: 'KeyboardDataQueueSize'
    valueType: dword
    value: '256'
    ignoreErrors: true

  # ═══════════════════════════════════════════
  # Kernel / timers (YAML first-class — FullStack reinforces)
  # ═══════════════════════════════════════════
  - type: registry.set
    id: edge-distribute-timers
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
    valueName: 'DistributeTimers'
    valueType: dword
    value: '1'
    ignoreErrors: true
  - type: registry.set
    id: edge-cs-enabled
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Power'
    valueName: 'CsEnabled'
    valueType: dword
    value: '0'
    ignoreErrors: true
    description: 'Connected Standby off on desktop'
  - type: registry.set
    id: edge-hiberboot
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power'
    valueName: 'HiberbootEnabled'
    valueType: dword
    value: '0'
    ignoreErrors: true
    description: 'Fast Startup off — cleaner boots, less hybrid hibernate junk'

  # ═══════════════════════════════════════════
  # Monitor / GPU display pack
  # ═══════════════════════════════════════════
  - type: registry.set
    whenOption: extremeMode
    id: edge-mpo-leave
    path: 'HKLM\SOFTWARE\Microsoft\Windows\Dwm'
    valueName: 'OverlayTestMode'
    valueType: dword
    value: '0'
    ignoreErrors: true
    description: 'Do not force MPO off (GPU-specific; leave default)'
  - type: service.set
    whenOption: extremeMode
    id: edge-display-enhance
    service: DisplayEnhancementService
    start: manual
    stop: true
    ignoreErrors: true
    description: 'Quiet Display Enhancement (Extreme)'
  - type: registry.set
    whenOption: extremeMode
    id: edge-tdr-delay
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers'
    valueName: 'TdrDelay'
    valueType: dword
    value: '10'
    ignoreErrors: true
    description: 'Slightly longer TDR before recovery (fewer mid-game resets)'

  # ═══════════════════════════════════════════
  # Privacy — Extreme telemety floor
  # ═══════════════════════════════════════════
  - type: registry.set
    whenOption: extremeMode
    id: edge-diagtrack-listener
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    valueName: 'DisableEnterpriseAuthProxy'
    valueType: dword
    value: '1'
    ignoreErrors: true
  - type: registry.set
    whenOption: extremeMode
    id: edge-ceip
    path: 'HKLM\SOFTWARE\Policies\Microsoft\SQMClient\Windows'
    valueName: 'CEIPEnable'
    valueType: dword
    value: '0'
    ignoreErrors: true

  # ═══════════════════════════════════════════
  # Scripts — audio / USB / startup permanence
  # ═══════════════════════════════════════════
  - type: run
    id: edge-audio
    file: scripts/Tune-AudioLatency.ps1
    runAs: admin
    ignoreErrors: true
    timeoutMs: 60000
    description: 'WASAPI: no ducking, SysFx off, GameDVR mic off'
  - type: run
    whenOption: extremeMode
    id: edge-usb-hid
    file: scripts/Tune-UsbHidPower.ps1
    runAs: admin
    ignoreErrors: true
    timeoutMs: 120000
    description: 'USB hub + HID: selective suspend / enhanced power off'
  - type: run
    whenOption: extremeMode
    id: edge-startup
    file: scripts/Tune-StartupPermanence.ps1
    runAs: admin
    ignoreErrors: true
    timeoutMs: 90000
    description: 'StartupApproved/Run cleanup so process count stays low after reboot'

  # Edge update tasks (permanence)
  - type: task.disable
    whenOption: extremeMode
    id: edge-task-edgeupdate-core
    taskPath: '\MicrosoftEdgeUpdateTaskMachineCore'
    ignoreErrors: true
  - type: task.disable
    whenOption: extremeMode
    id: edge-task-edgeupdate-ua
    taskPath: '\MicrosoftEdgeUpdateTaskMachineUA'
    ignoreErrors: true

  # ═══════════════════════════════════════════
  # Memory / NTFS (from curated 70-kernel-mmcss — now wired)
  # ═══════════════════════════════════════════
  - type: registry.set
    id: edge-page-combining
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
    valueName: 'DisablePageCombining'
    valueType: dword
    value: '1'
    ignoreErrors: true
  - type: registry.set
    id: edge-large-cache-off
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
    valueName: 'LargeSystemCache'
    valueType: dword
    value: '0'
    ignoreErrors: true
    description: 'Prefer program working set over system cache'
  - type: registry.set
    id: edge-ntfs-last-access
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem'
    valueName: 'NtfsDisableLastAccessUpdate'
    valueType: dword
    value: '1'
    ignoreErrors: true
  - type: registry.set
    id: edge-ntfs-8dot3
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem'
    valueName: 'NtfsDisable8dot3NameCreation'
    valueType: dword
    value: '1'
    ignoreErrors: true

  # ═══════════════════════════════════════════
  # Capture / Game Bar extras
  # ═══════════════════════════════════════════
  - type: registry.set
    id: edge-allow-gamemode
    path: 'HKCU\Software\Microsoft\GameBar'
    valueName: 'AllowAutoGameMode'
    valueType: dword
    value: '1'
    ignoreErrors: true
  - type: registry.set
    id: edge-app-capture
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\GameDVR'
    valueName: 'AppCaptureEnabled'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: edge-hist-capture
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\GameDVR'
    valueName: 'HistoricalCaptureEnabled'
    valueType: dword
    value: '0'
    ignoreErrors: true

  # ═══════════════════════════════════════════
  # Desktop clutter (AMOLED-black, no transparency)
  # ═══════════════════════════════════════════
  - type: registry.set
    id: edge-apps-dark
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
    valueName: 'AppsUseLightTheme'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: edge-system-dark
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
    valueName: 'SystemUsesLightTheme'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: edge-transparency
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
    valueName: 'EnableTransparency'
    valueType: dword
    value: '0'
    ignoreErrors: true
    description: 'Flat panels — snappier shell paint'
  - type: registry.set
    id: edge-taskbar-endtask
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings'
    valueName: 'TaskbarEndTask'
    valueType: dword
    value: '1'
    ignoreErrors: true
  - type: note
    id: extreme-note
    whenOption: extremeMode
    description: >-
      Extreme edge active. DISM+VBS+deep quiet run with this profile. Defender still
      follows your Defender setup choice (keep if anti-cheat needs it).

  # ── Latency / scheduler / GPU scheduling (safe registry) ──
  # MMCSS — verified against MS docs (not Twitter hype):
  # SystemResponsiveness: % reserved for low-priority. <10 or >100 clamp to 20.
  # So value 0 is cargo-cult and becomes DEFAULT 20. Min valid gaming = 10.
  # Scheduling Category High: Priority field is always treated as 2 (MS).
  # GPU Priority / SFIO Priority: documented as unused.
  # https://learn.microsoft.com/windows/win32/procthread/multimedia-class-scheduler-service
  - type: registry.set
    id: ext-search-box
    whenOption: extremeMode
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Search'
    valueName: 'SearchboxTaskbarMode'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: ext-bing-search
    whenOption: extremeMode
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Search'
    valueName: 'BingSearchEnabled'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: ext-cortana
    whenOption: extremeMode
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    valueName: 'AllowCortana'
    valueType: dword
    value: '0'
    ignoreErrors: true
  - type: registry.set
    id: ext-websearch
    whenOption: extremeMode
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    valueName: 'DisableWebSearch'
    valueType: dword
    value: '1'
    ignoreErrors: true

  # Notifications / tips
  - type: registry.set
    id: ext-toasts
    whenOption: extremeMode
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\PushNotifications'
    valueName: 'ToastEnabled'
    valueType: dword

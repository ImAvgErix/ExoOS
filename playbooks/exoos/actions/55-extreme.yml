  - type: note
    id: nuclear-note
    whenOption: extremeMode
    risk: nuclear
    description: >-
      EXTREME (Maximum FPS): print spooler disabled, CPU mitigations stripped,
      extra quiet. Windows Update is paused (not permanently killed) so you can resume.
      Can break printers and some anti-cheat. Reboot after apply.

  # Windows Update: pause is applied for ALL profiles in 58-shared-baseline.
  # Extreme only quiets wake/scan tasks — does NOT disable wuauserv/BITS permanently.
  - type: task.disable
    id: nuc-task-uso-scan
    whenOption: extremeMode
    risk: nuclear
    taskPath: '\Microsoft\Windows\UpdateOrchestrator\Schedule Scan'
    ignoreErrors: true

title: Gaming defaults
actions:
  - type: registry.set
    id: game-mode-on
    path: HKCU\Software\Microsoft\GameBar
    valueName: AutoGameModeEnabled
    valueType: dword
    value: "1"

  - type: registry.set
    id: game-mode-allow
    path: HKCU\Software\Microsoft\GameBar
    valueName: AllowAutoGameMode
    valueType: dword
    value: "1"

  - type: registry.set
    id: gamebar-exo-off
    path: HKCU\Software\Microsoft\GameBar
    valueName: UseNexusForGameBarEnabled
    valueType: dword
    value: "0"

  - type: registry.set
    id: gamedvr-off
    path: HKCU\System\GameConfigStore
    valueName: GameDVR_Enabled
    valueType: dword
    value: "0"

  - type: registry.set
    id: app-capture-off
    path: HKCU\Software\Microsoft\Windows\CurrentVersion\GameDVR
    valueName: AppCaptureEnabled
    valueType: dword
    value: "0"

  - type: registry.set
    id: historical-capture-off
    path: HKCU\Software\Microsoft\Windows\CurrentVersion\GameDVR
    valueName: HistoricalCaptureEnabled
    valueType: dword
    value: "0"

  - type: registry.set
    id: policy-gamedvr-off
    path: HKLM\SOFTWARE\Policies\Microsoft\Windows\GameDVR
    valueName: AllowGameDVR
    valueType: dword
    value: "0"

  # MS MMCSS: Scheduling Category matters. Priority under High is forced to 2.
  # GPU Priority / SFIO unused. SystemResponsiveness 0 clamps to 20 — use 10.
  - type: registry.set
    id: mmcss-games-scheduling
    path: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games
    valueName: Scheduling Category
    valueType: string
    value: High
    description: MS-verified Games scheduling category

  - type: registry.set
    id: system-responsiveness
    path: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile
    valueName: SystemResponsiveness
    valueType: dword
    value: "10"
    description: "MS: 10% low-prio reserve (min valid). 0 clamps to default 20."

  - type: registry.set
    id: network-throttling-off
    path: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile
    valueName: NetworkThrottlingIndex
    valueType: dword
    value: "4294967295"
    description: Disable multimedia network throttle index

  - type: registry.set
    whenOption: extremeMode
    id: win32-priority-separation
    path: HKLM\SYSTEM\CurrentControlSet\Control\PriorityControl
    valueName: Win32PrioritySeparation
    valueType: dword
    value: "38"
    description: "0x26 short, variable, high foreground boost (Exo-class)"

title: ExoOS identity
actions:
  - type: note
    id: product-note
    description: >
      Exo OS 1.8.1 — Extreme gaming strip by default. Modern desktop retained.
      No Open-Shell. No always-on Windhawk. Applied marker is written at finalize.

  - type: registry.set
    id: marker-name
    path: HKLM\SOFTWARE\ExoOS
    valueName: Product
    valueType: string
    value: ExoOS

  - type: registry.set
    id: marker-version
    path: HKLM\SOFTWARE\ExoOS
    valueName: Version
    valueType: string
    value: "1.8.1"

id: exoos
name: Exo OS
version: 1.8.0
description: >
  Ultimate barebones gaming OS playbook. Default = Extreme (Maximum FPS): strip
  non-essentials across registry, tasks, services, AppX, DISM, VBS — keep the
  gaming path (Store, picked browsers, Discord/Steam-class apps). Balanced is an
  explicit dial-back. Shared: WU pause, SR=10, MMCSS Games High, HAGS,
  SwapEffect, input 1:1. Product catalog only — no third-party research dumps.
minWindowsBuild: '22000'
authors:
  - Exo
defaultOptions:
  keepStore: 'true'
  keepModernShell: 'true'
  noOpenShell: 'true'
  noWindhawk: 'true'
  # Product default = Extreme barebones gaming strip. Setup can dial back.
  defenderStrip: 'true'
  removeAi: 'true'
  removeOneDrive: 'true'
  # Extreme strips Edge; user browsers install from setup multi-select.
  stripEdge: 'true'
  privacyHosts: 'true'
  serviceStrip: 'true'
  installDirectX: 'true'
  installVcRedist: 'true'
  installDotNet8: 'true'
  installDotNet10: 'true'
  # Extras (setup multi-select — sensible defaults)
  install7zip: 'true'
  installSnipping: 'true'
  installPhotos: 'true'
  installNotepad: 'true'
  installTerminalPreview: 'true'
  installPowerShellPreview: 'false'
  # Browsers (setup multi-select)
  installBrave: 'false'
  installHelium: 'false'
  installZen: 'false'
  installFirefox: 'false'
  installLibreWolf: 'false'
  installChrome: 'false'
  # Popular apps (setup multi-select)
  installSteam: 'false'
  installDiscord: 'false'
  installEpic: 'false'
  installRiot: 'false'
  installRevo: 'false'
  installObs: 'false'
  installSpotify: 'false'
  disableVbs: 'true'
  # Extreme / Maximum FPS — product default
  extremeMode: 'true'
  amoled: 'false'
  disableTransparency: 'false'
  dnsCloudflare: 'false'
  dnsGoogle: 'false'
  dnsQuad9: 'false'
  dismStrip: 'true'
actionFiles:
  - actions/00-identity.yml
  - actions/generated/58-shared-baseline.yml
  - actions/generated/59-input-power-final.yml
  - actions/generated/61-full-os-depth.yml
  - actions/generated/05-exo-run.yml
  - actions/generated/10-reg-hkcu.yml
  - actions/generated/10-reg-hklm-software.yml
  - actions/generated/10-reg-hklm-system.yml
  - actions/generated/10-reg-hkcr.yml
  - actions/generated/10-reg-other.yml
  - actions/generated/15-defender-deep.yml
  - actions/generated/20-features-default.yml
  - actions/generated/25-optional-software.yml
  - actions/generated/40-services.yml
  - actions/generated/41-process-reduction.yml
  - actions/generated/50-tasks.yml
  - actions/generated/52-tasks-library.yml
  - actions/generated/55-extreme-edge.yml
  - actions/generated/56-gaming-polish.yml
  - actions/generated/57-extreme-nuclear.yml
  - actions/generated/60-network.yml
  - actions/generated/62-competitive-edge.yml
  - actions/generated/80-power.yml
  - actions/generated/85-dism-capabilities.yml
  - actions/generated/86-dism-features.yml
  - actions/generated/90-appx.yml
  - actions/99-finalize.yml


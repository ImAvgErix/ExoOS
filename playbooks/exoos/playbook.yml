id: exoos
name: Exo OS
version: 1.8.0
description: >
  Ultimate barebones gaming OS playbook. Default = Extreme (Maximum FPS): strip
  non-essentials across registry, tasks, services, AppX, DISM, VBS, deep baselines —
  keep gaming path (Store, picked browsers, Discord/Steam-class apps). Balanced is an
  explicit dial-back (safe ceiling, no nuclear). Shared: WU pause, SR=10, MMCSS Games High,
  HAGS, SwapEffect, input 1:1. See AUDIT-REPORT.md. Theater/cargo-cult quarantined.
minWindowsBuild: '22000'
authors:
  - Exo
defaultOptions:
  keepStore: 'true'
  keepModernShell: 'true'
  noOpenShell: 'true'
  noWindhawk: 'true'
  # Product default = Extreme barebones gaming strip. Setup can dial back.
  defenderStrip: 'true'
  removeAi: 'true'
  removeOneDrive: 'true'
  # Extreme strips Edge; user browsers install from setup multi-select.
  stripEdge: 'true'
  privacyHosts: 'true'
  serviceStrip: 'true'
  installDirectX: 'true'
  installVcRedist: 'true'
  installDotNet8: 'true'
  installDotNet10: 'true'
  # Extras (setup multi-select — sensible defaults)
  install7zip: 'true'
  installSnipping: 'true'
  installPhotos: 'true'
  installNotepad: 'true'
  installTerminalPreview: 'true'
  installPowerShellPreview: 'false'
  # Browsers (setup multi-select)
  installBrave: 'false'
  installHelium: 'false'
  installZen: 'false'
  installFirefox: 'false'
  installLibreWolf: 'false'
  installChrome: 'false'
  # Popular apps (setup multi-select)
  installSteam: 'false'
  installDiscord: 'false'
  installEpic: 'false'
  installRiot: 'false'
  installRevo: 'false'
  installObs: 'false'
  installSpotify: 'false'
  disableVbs: 'true'
  # Extreme / Maximum FPS — product default
  extremeMode: 'true'
  amoled: 'false'
  disableTransparency: 'false'
  dnsCloudflare: 'false'
  dnsGoogle: 'false'
  dnsQuad9: 'false'
  dismStrip: 'true'
actionFiles:
  - actions/00-identity.yml
  - actions/generated/00-exo-baseline.yml
